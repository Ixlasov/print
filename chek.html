<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chek</title>
  <style id="base-styles">
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    body {
      background: #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px 8px;
      font-family: Arial, Helvetica, 'Segoe UI', sans-serif;
      font-weight: 700;
      color: #000;
      text-rendering: geometricPrecision;
    }

    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 60px;
    }

    .comment-block {
      margin: 10px 0;
      padding: 5px;
      font-style: italic;
      text-align: center;
      border-top: 1px dashed #ccc;
      border-bottom: 1px dashed #ccc;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 13px;
      color: #444;
      font-family: Arial, Helvetica, sans-serif;
    }

    .error-box {
      background: #fff0f0;
      border: 1px solid #f99;
      border-radius: 6px;
      padding: 14px 18px;
      color: #c00;
      font-size: 13px;
      text-align: center;
      margin-top: 40px;
      max-width: 300px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .print-btn {
      margin-bottom: 10px;
      padding: 8px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
    }

    .print-btn:hover { background: #333; }

    .receipt-wrapper {
      background: #fff;
      width: var(--receipt-width, 72mm);
      max-width: var(--receipt-width, 72mm);
      margin: 0 auto;
      padding: var(--receipt-pad, 2mm 4mm);
      overflow-x: hidden;
      font-size: var(--receipt-font, 12px);
      font-weight: 400;
      font-family: Arial, Helvetica, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
      text-rendering: geometricPrecision;
    }

    .shop-name,
    .grand-total,
    .item-name {
      font-weight: 900;
    }

    .shop-name {
      font-size: var(--title-size, 14px);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .shop-sub {
      text-align: center;
      font-size: var(--meta-size, 10px);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    .shop-company {
      text-align: center;
      font-size: var(--meta-size, 10px);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 1px;
      line-height: 1.35;
      word-break: break-word;
    }

    .divider-double {
      border: none;
      border-top: 2px double #000;
      margin: 5px 0;
    }

    .divider {
      border: none;
      border-top: 1px dashed #555;
      margin: 4px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: nowrap;
      gap: 4px;
      font-size: 0.95em;
      padding: 1px 0;
      line-height: 1.35;
    }

    .info-row .label {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .info-row .value {
      flex: 0 0 auto;
      text-align: right;
      white-space: nowrap;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
    }

    .info-row.info-row-wrap .value {
      flex: 1 1 0;
      min-width: 0;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-family: Arial, Helvetica, 'Segoe UI', sans-serif;
    }

    .item-block {
      padding: 3px 0;
      border-bottom: 1px dashed #bbb;
    }

    .item-block:last-child { border-bottom: none; }

    .item-name {
      font-size: 0.95em;
      line-height: 1.25;
      word-break: break-word;
      overflow-wrap: anywhere;
      margin-bottom: 1px;
    }

    .item-detail {
      display: flex;
      margin-left: var(--item-indent, 12px);
      justify-content: space-between;
      gap: 4px;
      font-size: 0.92em;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
    }

    .item-detail .d-left { flex: 1; min-width: 0; word-break: break-word; }
    .item-detail .d-price { flex: 0 0 auto; text-align: center; white-space: nowrap; }
    .item-detail .d-total { flex: 0 0 auto; text-align: right; white-space: nowrap; }

    .items-footer {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      font-size: 0.92em;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      padding: 3px 0 1px;
      border-top: 1px solid #000;
      margin-top: 2px;
    }

    .sum-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      font-size: 0.92em;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      padding: 1px 0;
    }

    .sum-row.discount .val { color: #000; }

    .grand-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      font-size: 1.08em;
      font-weight: 900;
      font-family: Arial, Helvetica, sans-serif;
      padding: 4px 0;
      border-top: 2px solid #000;
      border-bottom: 2px solid #000;
      margin: 4px 0;
    }

    .grand-total span:last-child {
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
    }

    .pay-section { margin-top: 3px; }

    .pay-title {
      font-size: 0.85em;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .pay-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      font-size: 0.92em;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      padding: 1px 0;
    }

    .pay-row span:first-child {
      font-family: Arial, Helvetica, sans-serif;
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .credit-block {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding: 4px 6px;
      border: 1.5px solid #000;
    }

    .credit-label {
      font-size: 0.85em;
      font-weight: 800;
    }

    .credit-amt {
      font-size: 0.95em;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
    }

    .footer {
      text-align: center;
      font-size: 0.85em;
      font-weight: 800;
      margin-top: 6px;
      line-height: 1.5;
    }

    @media print {
      body {
        background: none;
        padding: 0;
        width: var(--paper-width, 80mm);
      }

      .print-btn { display: none !important; }

      .receipt-wrapper {
        width: var(--receipt-width, 72mm);
        max-width: var(--receipt-width, 72mm);
        margin: 0 auto;
        padding: var(--receipt-pad, 2mm 4mm);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      @page {
        size: var(--paper-size, 80mm auto);
        margin: 0;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    /** API manzil — o'zingizniki bilan almashtiring */
    const API_BASE = "https://script.google.com/macros/s/AKfycbwbVJxAcFnjM5Q7v-yq-NkrZTyk1tcZIMUkvxdCp-J4ICPn-Ro1ueF_MX4l2jhk_vKTfA/exec";

    /** Termal format: URL da ?format=58mm yoki ?format=80mm (default: 80mm) */
    const THERMAL = {
      '80mm': {
        paper: '80mm auto',
        paperWidth: '80mm',
        width: '72mm',
        font: '12px',
        pad: '2mm 4mm',
        title: '14px',
        meta: '10px',
        itemIndent: '12px'
      },
      '58mm': {
        paper: '58mm auto',
        paperWidth: '58mm',
        width: '48mm',
        font: '11px',
        pad: '1mm 2mm',
        title: '12px',
        meta: '9px',
        itemIndent: '8px'
      }
    };

    function getFormat() {
      const f = new URLSearchParams(window.location.search).get('format');
      return THERMAL[f] ? f : '80mm';
    }

    function applyThermalFormat(formatKey) {
      const cfg = THERMAL[formatKey] || THERMAL['80mm'];
      document.documentElement.style.setProperty('--paper-size', cfg.paper);
      document.documentElement.style.setProperty('--paper-width', cfg.paperWidth);
      document.documentElement.style.setProperty('--receipt-width', cfg.width);
      document.documentElement.style.setProperty('--receipt-pad', cfg.pad);
      document.documentElement.style.setProperty('--receipt-font', cfg.font);
      document.documentElement.style.setProperty('--title-size', cfg.title);
      document.documentElement.style.setProperty('--meta-size', cfg.meta);
      document.documentElement.style.setProperty('--item-indent', cfg.itemIndent);
      return cfg;
    }

    function fmt(n) { return Number(n || 0).toLocaleString('uz-UZ'); }

    function fmtDate(raw) {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d)) return String(raw);
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}  ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function accountLabel(type) {
      const map = { cash: 'Naqd pul', card: 'Plastik karta', transfer: "Bank o'tkazma", credit: 'Nasiya' };
      return map[String(type).toLowerCase()] || type || 'Boshqa';
    }

    function showLoader() {
      document.getElementById('app').innerHTML = `
        <div class="loader-wrap">
          <div class="spinner"></div>
          <div class="loader-text">Ma'lumot yuklanmoqda...</div>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('app').innerHTML = `<div class="error-box">⚠ ${msg}</div>`;
    }

    function renderReceipt(data) {
      const s = data.sale;
      const items = data.items || [];
      const payments = data.payments || [];
      const summary = data.summary || {};

      const itemBlocks = items.map((it, i) => `
        <div class="item-block">
          <div class="item-name">${i + 1}. ${it.product_name || '—'}</div>
          <div class="item-detail">
            <span class="d-left">${it.quantity_2 || '-'}<br /></span>
            <span class="d-price">${fmt(it.price)} so'm</span> - 
            <span class="d-total">${fmt(it.total)}</span>
          </div>
        </div>`).join('');

      const payRows = payments.map(p => `
        <div class="pay-row">
          <span>${accountLabel(p.type)}</span>
          <span>${fmt(p.amount)} so'm</span>
        </div>`).join('');

      const discountRow = Number(s.discount) ? `
        <div class="sum-row discount">
          <span>Chegirma:</span>
          <span class="val">- ${fmt(s.discount)} so'm</span>
        </div>` : '';

      const refundRow = Number(s.refund_amount) ? `
        <div class="sum-row discount">
          <span>Qaytarma:</span>
          <span class="val">- ${fmt(s.refund_amount)} so'm</span>
        </div>` : '';

      const creditBlock = Number(s.credit_amount) ? `
        <div class="credit-block">
          <span class="credit-label">&#9651; NASIYA QOLDIG'I</span>
          <span class="credit-amt">${fmt(s.credit_amount)} so'm</span>
        </div>` : '';

      const commentBlock = (s.comment && s.comment.trim() !== '') ? `
        <div class="comment-block">
          <strong>Izoh:</strong> ${s.comment}
        </div>` : '';

      const customerName = s.customer_name || '—';

      const html = `
        <button class="print-btn" onclick="window.print()">&#128438; Chek chop etish</button>
        <div class="receipt-wrapper">

          <div class="shop-name">N18</div>
          <div class="shop-company">Taxiatosh Dehqon Bozori</div>
          <div class="shop-company">№ 18 - do'kon</div>
          <div class="shop-company">+998 (99)-081-16-53</div>
          <div class="shop-sub">Savdo cheki</div>

          <hr class="divider-double">

          <div class="info-row info-row-wrap">
            <span class="label">Mijoz:</span>
            <span class="value">${customerName}</span>
          </div>
          <div class="info-row">
            <span class="label">Sana:</span>
            <span class="value">${fmtDate(s.created_at)}</span>
          </div>

          <hr class="divider">

          <div>${itemBlocks}</div>

          <div class="items-footer">
            <span>Jami: ${summary.total_qty_1 || 0} / ${summary.total_qty_2 || 0} ta</span>
            <span>${fmt(s.total_amount)} so'm</span>
          </div>

          <hr class="divider">

          <div class="sum-row"><span>Umumiy summa:</span><span>${fmt(s.total_amount)} so'm</span></div>
          ${discountRow}
          ${refundRow}

          <div class="grand-total">
            <span>TO'LOV SUMMASI</span>
            <span>${fmt(s.payment_total)} so'm</span>
          </div>

          ${payments.length ? `
            <div class="pay-section">
              <div class="pay-title">To'lov usullari</div>
              ${payRows}
            </div>` : ''}

          ${creditBlock}
          ${commentBlock}

          <hr class="divider-double">

          <div class="footer">XARIDINGIZ UCHUN RAHMAT!</div>
        </div>`;

      document.getElementById('app').innerHTML = html;
      setTimeout(() => window.print(), 300);
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const saleId = params.get('sale_id') || params.get('id');
      const format = getFormat();
      applyThermalFormat(format);

      if (!saleId) {
        showError("URL da sale_id ko'rsatilmagan.<br>Misol: ?sale_id=123&amp;format=58mm");
        return;
      }

      showLoader();
      try {
        const res = await fetch(`${API_BASE}?sale_id=${encodeURIComponent(saleId)}`);
        const data = await res.json();
        if (!data.success) {
          showError(data.message || 'Ma\'lumot topilmadi');
          return;
        }
        renderReceipt(data);
      } catch (e) {
        showError('Server bilan ulanishda xatolik.<br>' + e.message);
      }
    }

    init();
  </script>
</body>

</html>
