<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>80mm Check</title>

<style>

body{
    width:80mm;
    margin:auto;
    font-family:Arial;
    font-size:12px;
}

.center{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:3px;
}

.right{
    text-align:right;
}

.line{
    border-top:1px dashed black;
    margin:5px 0;
}

.hide{
    display:none;
}

@media print{
    button{
        display:none;
    }
}

</style>
</head>
<body>

<div id="receipt"></div>

<button onclick="window.print()">
Print
</button>

<script>

const TEST_DATA = {
success:true,

sale:{
id:123,
customer_name:"Test Mijoz",
total_amount:300000,
discount:10000,
final_amount:290000,
payment_total:250000,
credit_amount:40000,
refund_amount:0,
created_at:"2026-06-13 15:20"
},

items:[
{
product_name:"Coca Cola",
qty_1:2,
qty_2:5,
price:12000,
total:60000
},
{
product_name:"Pepsi",
qty_1:3,
qty_2:5,
price:15000,
total:75000
}
],

payments:[
{
type:"Cash",
amount:200000
},
{
type:"Card",
amount:50000
}
],

summary:{
total_qty_1:5,
total_qty_2:10
}
};

const SALE_ID =
new URLSearchParams(location.search)
.get("sale_id");

if(SALE_ID){

loadSale(SALE_ID);

}else{

render(TEST_DATA);

}

async function loadSale(id){

try{

const res = await fetch(
"https://script.google.com/macros/s/AKfycbwbVJxAcFnjM5Q7v-yq-NkrZTyk1tcZIMUkvxdCp-J4ICPn-Ro1ueF_MX4l2jhk_vKTfA/exec?sale_id="+id
);

const data = await res.json();

if(data.success){

render(data);

}else{

render(TEST_DATA);

}

}catch(e){

render(TEST_DATA);

}

}

function money(v){

return Number(v).toLocaleString("uz-UZ");

}

function render(data){

const sale = data.sale;

let html = `

<div class="center">

<h2>SMART SAVDO</h2>

<div>CHEK</div>

<div>${sale.created_at}</div>

<div>ID: ${sale.id}</div>

</div>

<div class="line"></div>

<div>
Mijoz: <b>${sale.customer_name}</b>
</div>

<div class="line"></div>

<table>

<thead>

<tr>
<th>Mahsulot</th>
<th>Soni</th>
<th>Narx</th>
<th>Jami</th>
</tr>

</thead>

<tbody>

`;

data.items.forEach(r=>{

html += `
<tr>

<td>${r.product_name}</td>

<td>
${r.qty_1}/${r.qty_2}
</td>

<td class="right">
${money(r.price)}
</td>

<td class="right">
${money(r.total)}
</td>

</tr>
`;

});

html += `

</tbody>

</table>

<div class="line"></div>

<div>

Jami savat:

<b>
${data.summary.total_qty_1}
 karobka,
${data.summary.total_qty_2}
 dona
</b>

</div>

<div class="line"></div>

`;

html += `
<div>
Mahsulotlar summasi:
<b>${money(sale.total_amount)}</b>
</div>
`;

if(Number(sale.discount)>0){

html += `
<div>
Chegirma:
<b>${money(sale.discount)}</b>
</div>
`;

}

html += `
<div>
Yakuniy summa:
<b>${money(sale.final_amount)}</b>
</div>
`;

html += `
<div>
To'langan:
<b>${money(sale.payment_total)}</b>
</div>
`;

if(Number(sale.credit_amount)>0){

html += `
<div>
Qoldiq qarz:
<b>${money(sale.credit_amount)}</b>
</div>
`;

}

if(Number(sale.refund_amount)>0){

html += `
<div>
Qaytim:
<b>${money(sale.refund_amount)}</b>
</div>
`;

}

html += `
<div class="line"></div>

<h4>To'lovlar</h4>
`;

data.payments.forEach(p=>{

html += `
<div>
${p.type} :
<b>${money(p.amount)}</b>
</div>
`;

});

html += `
<div class="line"></div>

<div class="center">
Tashrifingiz uchun rahmat
</div>
`;

document.getElementById("receipt").innerHTML =
html;

setTimeout(()=>{
window.print();
},500);

}

</script>

</body>
</html>
